{% extends "base.html" %}
{% block content %}
<div class="card center">
    <h2>修改密碼</h2>
    <form method="post">
        <label>舊密碼</label>
        <input name="old" type="password" required>
        <label>新密碼</label>
        <input name="new" type="password" required minlength="4">
        <label>再輸入一次</label>
        <input name="new2" type="password" required minlength="4">
        <button type="submit" class="btn btn-primary">更新</button>
    </form>
</div>
{% endblock %}
